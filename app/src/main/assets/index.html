<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f2f3f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="花椒日历" />
    <title>花椒日历</title>
    <script>
      /* 主题要在首屏渲染前定下来，否则夜间模式会先闪一下白底 */
      (function () {
        var mode = 'system';
        try {
          mode = localStorage.getItem('huajiao.themeMode') || 'system';
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
    <style>
/* ---------- 设计变量 ---------- */
:root {
  color-scheme: light;
  --bg: #f2f3f5;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --text: #16181d;
  --text-2: #6b7280;
  --text-3: #a0a6b0;
  --accent: #2f6bf5;
  --accent-soft: rgba(47, 107, 245, 0.1);
  --danger: #e5484d;
  --border: rgba(17, 24, 39, 0.07);
  --band: rgba(17, 24, 39, 0.018);
  --shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 10px 28px -18px rgba(17, 24, 39, 0.35);
  --radius: 16px;
  --radius-sm: 10px;
  --topbar-h: 52px;
}

/* 夜间模式：由 <html data-theme> 决定，设置页可手动切换（跟随系统 / 日间 / 夜间） */
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1115;
  --surface: #1a1d23;
  --surface-2: #23262d;
  --text: #e9ebef;
  --text-2: #9aa0aa;
  --text-3: #6d747f;
  --accent: #5b8cff;
  --accent-soft: rgba(91, 140, 255, 0.16);
  --danger: #ff6369;
  --border: rgba(255, 255, 255, 0.08);
  --band: rgba(255, 255, 255, 0.024);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 30px -20px rgba(0, 0, 0, 0.8);
}

/* ---------- 基础 ---------- */
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  /* 整页永远不参与横向滚动：翻页由 JS 接管。
     以前翻页动画的 translateX 会把文档撑宽，手指一横划，整个 WebView 跟着左右蹭，
     就是「应用整体左右晃动」的来源。 */
  overflow-x: clip;
  overscroll-behavior: none;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

button {
  font: inherit;
  color: inherit;
  border: none;
  background: none;
  cursor: pointer;
  padding: 0;
}

a {
  color: var(--accent);
  text-decoration: none;
}

#app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100dvh;
  padding-bottom: calc(72px + env(safe-area-inset-bottom));
  /* 整个应用范围内，横向手势都声明为「我们自己处理」。
     不写这条的话，手指落在 main 之外的区域（比如课少时的下半屏）时，
     浏览器会先按 auto 处理、直接开滚，等 JS 收到 touchmove 已经来不及 preventDefault。 */
  touch-action: pan-y;
}

/* 内容区：横向手势全部归我们（左右滑动翻页），纵向照旧交给浏览器滚动。
   这条是「只在有课的地方能滑」的关键——以前没有它，浏览器会先把横向拖动
   当成滚动/回弹吃掉，只有盖在课程块这种不参与滚动的元素上时才轮到 JS 处理。 */
main {
  touch-action: pan-y;
  overflow-x: clip;
  /* 内容不满一屏时也要撑满：否则下面那片空白属于 #app，
     手指按在那里根本收不到 main 的触摸事件，「空白处滑不动」就是这么来的 */
  min-height: calc(100dvh - var(--topbar-h) - 72px - env(safe-area-inset-bottom));
}

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-bottom: 1px solid var(--border);
}

.topbar h1 {
  font-size: 18px;
  font-weight: 600;
  margin: 0;
  letter-spacing: -0.01em;
}

.topbar .spacer {
  flex: 1;
}

.icon-btn {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--text-2);
  transition: background 0.15s;
}

.icon-btn:active {
  background: var(--accent-soft);
  color: var(--accent);
}

.icon-btn svg {
  width: 20px;
  height: 20px;
}

/* ---------- 周条 ---------- */
.weekbar {
  padding: 10px 10px 4px;
}

.weekbar-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 4px 8px 6px;
  font-size: 13.5px;
  color: var(--text-2);
}

.weekbar-head strong {
  color: var(--text);
  font-weight: 600;
  font-size: 15.5px;
}

.weekbar-nav {
  display: flex;
  align-items: center;
  gap: 6px;
}

/* 「今天」胶囊：已经在今天时淡下去，但仍可点 */
.today-chip {
  height: 30px;
  padding: 0 13px;
  border-radius: 15px;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  transition: background 0.15s, color 0.15s, transform 0.12s;
}

.today-chip:active {
  transform: scale(0.95);
}

.today-chip.is-here {
  color: var(--text-3);
  background: var(--surface-2);
}

/* 上一周 / 下一周：合成一个整体，比两个圆按钮更省横向空间 */
.nav-pair {
  display: flex;
  align-items: center;
  background: var(--surface-2);
  border-radius: 15px;
  overflow: hidden;
}

.nav-pair .icon-btn {
  width: 34px;
  height: 30px;
  border-radius: 0;
  color: var(--text-2);
}

.nav-pair .icon-btn + .icon-btn {
  border-left: 1px solid var(--border);
}

.nav-pair .icon-btn:active {
  background: var(--accent-soft);
  color: var(--accent);
}

.nav-pair .icon-btn svg {
  width: 17px;
  height: 17px;
}

.weekstrip {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
}

.day-cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 8px 0 9px;
  border-radius: 12px;
  transition: background 0.15s, color 0.15s;
}

.day-cell .dow {
  font-size: 11.5px;
  color: var(--text-3);
}

.day-cell .num {
  font-size: 17px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.day-cell .dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0;
}

.day-cell.has-class .dot {
  opacity: 1;
}

.day-cell.is-today .num {
  color: var(--accent);
}

.day-cell.selected {
  background: var(--accent);
}

.day-cell.selected .dow,
.day-cell.selected .num {
  color: #fff;
}

.day-cell.selected .dot {
  background: #fff;
}

/* ---------- 内容区 ---------- */
.page {
  padding: 4px 14px 20px;
}

/* 手指跟随阶段不要过渡，免得拖起来发飘；只在拖的时候提层，平时不占合成层 */
.page.dragging {
  transition: none;
  will-change: transform;
}

/* 松手没翻页：弹回原位 */
.page.snap-back {
  transition: transform 0.2s cubic-bezier(0.22, 0.61, 0.36, 1);
}


/* 左右滑动换页的滑入动画 */
@keyframes page-slide-left {
  from {
    opacity: 0.35;
    transform: translateX(24px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes page-slide-right {
  from {
    opacity: 0.35;
    transform: translateX(-24px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

.page.slide-left {
  animation: page-slide-left 0.22s ease both;
}

.page.slide-right {
  animation: page-slide-right 0.22s ease both;
}

.day-title {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 12px 2px 10px;
}

.day-title .main {
  font-size: 16.5px;
  font-weight: 600;
}

.day-title .sub {
  font-size: 13.5px;
  color: var(--text-2);
}

/* ---------- 课程卡片 ---------- */
.course-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.course-card {
  display: flex;
  gap: 0;
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  border: 1px solid var(--border);
  animation: card-in 0.28s ease both;
}

@keyframes card-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

/* 卡片现在可以点开详情，给一点按下反馈（动画占着 transform，这里用滤镜） */
.course-card:active {
  filter: brightness(0.97);
}

.course-card .bar {
  width: 4px;
  flex: 0 0 4px;
  background: var(--accent);
}

.course-card .body {
  padding: 12px 14px 13px;
  flex: 1;
  min-width: 0;
}

.course-card .row1 {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}

.course-card .section {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 2px 7px;
  border-radius: 6px;
  font-variant-numeric: tabular-nums;
}

.course-card .name {
  font-size: 16.5px;
  font-weight: 600;
  letter-spacing: -0.01em;
  word-break: break-word;
}

.course-card .meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  font-size: 14px;
  color: var(--text-2);
  margin-top: 6px;
}

.course-card .meta span {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.course-card .meta svg {
  width: 13px;
  height: 13px;
  opacity: 0.65;
  flex: 0 0 auto;
}

.tag {
  font-size: 12px;
  padding: 1px 6px;
  border-radius: 5px;
  background: var(--surface-2);
  color: var(--text-2);
  border: 1px solid var(--border);
  font-weight: 500;
}

.tag.warn {
  color: #b45309;
  background: rgba(245, 158, 11, 0.12);
  border-color: rgba(245, 158, 11, 0.2);
}

:root[data-theme="dark"] .tag.warn {
  color: #fbbf24;
}

/* ---------- 状态 ---------- */
.state {
  text-align: center;
  padding: 56px 24px;
  color: var(--text-2);
}

.state .emoji {
  font-size: 36px;
  opacity: 0.5;
  margin-bottom: 12px;
}

.state .title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.state .desc {
  font-size: 14px;
  color: var(--text-2);
  line-height: 1.6;
}

.state .actions {
  margin-top: 18px;
  display: flex;
  gap: 10px;
  justify-content: center;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 40px;
  padding: 0 18px;
  border-radius: 11px;
  font-size: 15.5px;
  font-weight: 600;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  transition: transform 0.12s, opacity 0.15s;
}

.btn:active {
  transform: scale(0.97);
}

.btn.primary {
  background: var(--accent);
  color: #fff;
  border-color: transparent;
}

.btn.block {
  width: 100%;
}

.btn:disabled {
  opacity: 0.5;
  pointer-events: none;
}

.btn.ghost {
  background: transparent;
}

/* 骨架屏 */
.skeleton {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 14px;
  margin-bottom: 10px;
}

.sk-line {
  height: 12px;
  border-radius: 6px;
  background: linear-gradient(
    90deg,
    var(--surface-2) 25%,
    color-mix(in srgb, var(--surface-2) 55%, var(--bg)) 37%,
    var(--surface-2) 63%
  );
  background-size: 400% 100%;
  animation: shimmer 1.3s ease infinite;
}

.sk-line + .sk-line {
  margin-top: 9px;
}

@keyframes shimmer {
  from {
    background-position: 100% 50%;
  }
  to {
    background-position: 0 50%;
  }
}

/* ---------- 绑定页 ---------- */
.bind-wrap {
  padding: 26px 20px;
}

.bind-hero {
  text-align: center;
  margin-bottom: 26px;
}

.bind-hero .logo {
  width: 64px;
  height: 64px;
  border-radius: 18px;
  margin: 0 auto 14px;
  display: grid;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent);
}

.bind-hero .logo svg {
  width: 32px;
  height: 32px;
}

.bind-hero h2 {
  font-size: 21px;
  margin: 0 0 8px;
  letter-spacing: -0.02em;
}

.bind-hero p {
  font-size: 14.5px;
  color: var(--text-2);
  margin: 0;
  line-height: 1.6;
}

.field {
  margin-bottom: 14px;
}

.field label {
  display: block;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-2);
  margin-bottom: 7px;
}

.field textarea,
.field input {
  width: 100%;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  padding: 12px 13px;
  font-size: 15px;
  font-family: inherit;
  resize: vertical;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.field textarea {
  min-height: 84px;
}

.field textarea:focus,
.field input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.field .hint {
  font-size: 12.5px;
  color: var(--text-3);
  margin-top: 6px;
  line-height: 1.55;
}

.steps {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 22px;
}

.steps ol {
  margin: 0;
  padding-left: 18px;
  font-size: 14.5px;
  color: var(--text-2);
  line-height: 1.9;
}

.steps li::marker {
  color: var(--accent);
  font-weight: 700;
}

.steps strong {
  color: var(--text);
  font-weight: 600;
}

.form-msg {
  font-size: 13.5px;
  margin-top: 10px;
  min-height: 18px;
}

.form-msg.error {
  color: var(--danger);
}

.form-msg.ok {
  color: #16a34a;
}

/* ---------- 设置页 ---------- */
/* 限定 div：课表卡片里也有 <span class="section">（节次徽章），
   以前这条 margin-bottom 把它顶上去，徽章和课程名永远对不齐 */
div.section {
  margin-bottom: 22px;
}

.section-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-3);
  padding: 0 4px 8px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.list {
  background: var(--surface);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
  box-shadow: var(--shadow);
}

.list-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  width: 100%;
  text-align: left;
  transition: background 0.12s;
}

.list-item:active {
  background: var(--surface-2);
}

.list-item + .list-item {
  border-top: 1px solid var(--border);
}

.list-item .li-main {
  flex: 1;
  min-width: 0;
}

.list-item .li-title {
  font-size: 15.5px;
  font-weight: 500;
}

.list-item .li-desc {
  font-size: 13.5px;
  color: var(--text-2);
  margin-top: 2px;
  word-break: break-all;
}

.list-item .chev {
  color: var(--text-3);
  flex: 0 0 auto;
}

.list-item .chev svg {
  width: 16px;
  height: 16px;
}

.list-item.danger .li-title {
  color: var(--danger);
}

/* 每行左侧的小图标块：把设置项按「账号 / 数据 / 关于」视觉分组 */
.list-item .li-ico {
  width: 32px;
  height: 32px;
  flex: 0 0 auto;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: var(--accent-soft);
  color: var(--accent);
}

.list-item .li-ico svg {
  width: 18px;
  height: 18px;
}

.list-item .li-ico.danger {
  background: rgba(229, 72, 77, 0.12);
  color: var(--danger);
}

.list-item .li-value {
  flex: 0 0 auto;
  font-size: 13.5px;
  color: var(--text-3);
}

/* 行内小按钮（清除缓存那种） */
.chip-btn {
  flex: 0 0 auto;
  height: 30px;
  padding: 0 13px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  transition: opacity 0.15s, transform 0.12s;
}

.chip-btn:active {
  opacity: 0.7;
  transform: scale(0.96);
}

/* 分段选择器（外观模式用） */
.seg {
  display: flex;
  gap: 3px;
  background: var(--surface-2);
  border-radius: 11px;
  padding: 3px;
}
.seg button {
  flex: 1;
  height: 34px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-2);
  transition: background 0.15s, color 0.15s, box-shadow 0.15s;
}
.seg button.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 1px 3px rgba(17, 24, 39, 0.16);
}

/* ---------- 底部导航 ---------- */
.tabbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  display: flex;
  justify-content: center;
  gap: 2px;
  padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-top: 1px solid var(--border);
}

.tabbar .tab {
  flex: 1;
  max-width: 150px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 5px 0;
  color: var(--text-3);
  font-size: 11.5px;
  font-weight: 500;
  transition: color 0.15s;
}

.tabbar .tab.active {
  color: var(--accent);
}

.tabbar .tab svg {
  width: 22px;
  height: 22px;
}

/* ---------- 校历 ---------- */
.cal-wrap {
  margin: 14px;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
  box-shadow: var(--shadow);
  /* 没放大时让竖向滑动交给页面滚动；放大后改为自己处理拖动 */
  touch-action: pan-y;
}
.cal-wrap.zoomed {
  touch-action: none;
}
.cal-wrap img {
  display: block;
  width: 100%;
  transform-origin: 0 0;
  will-change: transform;
  user-select: none;
  -webkit-user-select: none;
  -webkit-user-drag: none;
  -webkit-touch-callout: none;
}
.cal-hint {
  font-size: 12.5px;
  color: var(--text-3);
  text-align: center;
  padding: 0 14px 16px;
}

/* 缩放按钮：固定在右下角、导航条上方。
   元素放在 #app 内部，切换到别的页面时会被整体覆盖掉，不会残留 */
.zoom-bar {
  position: fixed;
  right: 14px;
  bottom: calc(80px + env(safe-area-inset-bottom));
  z-index: 25;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.zoom-bar[hidden] {
  display: none;
}
.zoom-bar button {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--surface-2);
  border: 1px solid color-mix(in srgb, var(--text) 14%, transparent);
  color: var(--text);
  box-shadow: 0 3px 14px rgba(17, 24, 39, 0.2), 0 1px 3px rgba(17, 24, 39, 0.12);
  transition: transform 0.12s, opacity 0.15s;
}
.zoom-bar button:active {
  transform: scale(0.92);
}
.zoom-bar button:disabled {
  opacity: 0.5;
}
.zoom-bar svg {
  width: 18px;
  height: 18px;
}

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(86px + env(safe-area-inset-bottom));
  transform: translateX(-50%) translateY(8px);
  background: rgba(24, 26, 31, 0.92);
  color: #fff;
  font-size: 13.5px;
  padding: 9px 16px;
  border-radius: 10px;
  opacity: 0;
  transition: opacity 0.2s, transform 0.2s;
  pointer-events: none;
  z-index: 60;
  max-width: 80vw;
  text-align: center;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* 顶部下拉刷新提示 */
.refresh-hint {
  font-size: 12.5px;
  color: var(--text-3);
  text-align: center;
  padding: 6px 0 2px;
}

/* 整周确实没课（区别于「还没加载完」） */
.week-empty-tip {
  font-size: 12.5px;
  color: var(--text-3);
  text-align: center;
  padding: 8px 0 2px;
}

/* ---------- 视图切换 ---------- */
.view-switch {
  display: flex;
  background: var(--surface-2);
  border-radius: 9px;
  padding: 2px;
  margin-right: 2px;
}

.view-switch button {
  padding: 5px 14px;
  font-size: 14px;
  font-weight: 600;
  color: var(--text-2);
  border-radius: 7px;
  transition: background 0.15s, color 0.15s, box-shadow 0.15s;
}

.view-switch button.active {
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 1px 3px rgba(17, 24, 39, 0.14);
}

/* ---------- 周视图网格 ---------- */
.page.week-mode {
  padding: 0 0 4px;
}

.week-grid {
  display: grid;
  /* 左侧节次轴收窄，宽度尽量让给课程块 */
  grid-template-columns: 24px repeat(7, minmax(0, 1fr));
  /* 行高可伸缩：整块撑满一屏，课程块才不至于又小又挤、下面还空一大片 */
  grid-template-rows: 42px repeat(var(--rows, 10), minmax(30px, 1fr));
  grid-auto-rows: minmax(30px, 1fr);
  align-content: stretch;
  gap: 4px 3px;
  padding: 6px 7px 8px;
  /* 100dvh 减掉：顶栏 52 + 周条 52（周视图里日期条隐藏，只剩标题行）
     + 82（#app 给底栏预留的 72 与 .page 的 10）。
     算准了才不会多出几像素的滚动，否则一滑就整页晃一下。 */
  min-height: calc(100dvh - var(--topbar-h) - 52px - 82px - env(safe-area-inset-bottom));
}

/* 底纹：每两节一组的浅色横带 + 今天那一列的淡色竖带，扫一眼就能定位 */
.wg-band {
  pointer-events: none;
  border-radius: 9px;
}

.wg-band.alt {
  background: var(--band);
}

.wg-band.today {
  background: var(--accent-soft);
  opacity: 0.5;
}

.wg-head {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  border-radius: 9px;
  transition: background 0.15s;
}

.wg-head .wd {
  font-size: 11.5px;
  color: var(--text-3);
  line-height: 1;
}

.wg-head .dn {
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

.wg-head.is-today .dn {
  color: var(--accent);
}

.wg-head.is-sel {
  background: var(--accent-soft);
}

.wg-head.is-sel .wd,
.wg-head.is-sel .dn {
  color: var(--accent);
}

.wg-time {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10.5px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.course-block {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 4px 3px;
  border-radius: 8px;
  color: #fff;
  text-align: left;
  overflow: hidden;
  box-shadow: 0 1px 2px rgba(17, 24, 39, 0.16);
  transition: transform 0.12s, filter 0.15s;
}

.course-block:active {
  transform: scale(0.95);
  filter: brightness(0.93);
}

.course-block .cb-name {
  font-size: 12px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.01em;
  word-break: break-word;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* 只有一节的块矮，名字最多两行，把位置留给地点 */
.course-block.span1 {
  padding: 3px;
}

.course-block.span1 .cb-name {
  -webkit-line-clamp: 2;
}

.course-block .cb-loc {
  font-size: 10.5px;
  line-height: 1.2;
  opacity: 0.88;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: auto;
}

.course-block.inactive {
  opacity: 0.4;
}

/* 尚未加载的整列占位 */
.wg-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 7px;
  background: var(--surface-2);
  color: var(--text-3);
  font-size: 13px;
  letter-spacing: 0.15em;
  animation: wg-pulse 1.5s ease-in-out infinite;
}

@keyframes wg-pulse {
  0%,
  100% {
    opacity: 0.45;
  }
  50% {
    opacity: 0.95;
  }
}

/* 拉取失败的整列：可点击重试，别让用户对着转圈干等 */
.wg-fail {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  border-radius: 7px;
  border: 1px dashed var(--border);
  background: var(--surface-2);
  color: var(--text-3);
}

.wg-fail .wf-t {
  font-size: 10.5px;
  line-height: 1.2;
}

.wg-fail .wf-s {
  font-size: 10px;
  color: var(--accent);
  line-height: 1.2;
}

.wg-fail:active {
  filter: brightness(0.95);
}

/* ---------- 课程详情浮层 ---------- */
.sheet-wrap {
  position: fixed;
  inset: 0;
  z-index: 100;
}

.sheet-mask {
  position: absolute;
  inset: 0;
  background: rgba(10, 12, 16, 0.45);
  opacity: 0;
  transition: opacity 0.22s;
}

.sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  max-width: 560px;
  margin: 0 auto;
  background: var(--surface);
  border-radius: 20px 20px 0 0;
  padding: 8px 20px calc(26px + env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform 0.24s cubic-bezier(0.32, 0.72, 0, 1);
  box-shadow: 0 -8px 40px -12px rgba(0, 0, 0, 0.35);
}

.sheet-wrap.open .sheet-mask {
  opacity: 1;
}

.sheet-wrap.open .sheet {
  transform: none;
}

.sheet-handle {
  width: 36px;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  margin: 4px auto 14px;
}

.sheet-head {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 7px;
}

.sheet-head .section {
  font-size: 12.5px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 6px;
}

.sheet-date {
  font-size: 13px;
  color: var(--text-2);
}

.sheet h3 {
  margin: 0 0 16px;
  font-size: 20px;
  letter-spacing: -0.02em;
  line-height: 1.35;
}

.sheet dl {
  margin: 0;
  display: grid;
  gap: 11px;
}

.sheet dl > div {
  display: flex;
  gap: 14px;
  font-size: 15px;
}

.sheet dt {
  flex: 0 0 42px;
  color: var(--text-3);
}

.sheet dd {
  margin: 0;
  color: var(--text);
  word-break: break-all;
}

.sheet-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 14px;
}

.sheet-warn {
  font-size: 13px;
  color: #b45309;
  margin: 12px 0 0;
}

:root[data-theme="dark"] .sheet-warn {
  color: #fbbf24;
}

/* ================= 拓展页 ================= */
.tool-hero {
  margin: 14px 14px 18px;
  padding: 17px 18px 16px;
  border-radius: 18px;
  position: relative;
  overflow: hidden;
  color: #fff;
  background: linear-gradient(135deg, #2f6bf5 0%, #6c5cf0 62%, #8b5cf6 100%);
  box-shadow: 0 14px 32px -18px rgba(47, 107, 245, 0.95);
}
.tool-hero::after {
  content: "";
  position: absolute;
  right: -46px;
  top: -58px;
  width: 156px;
  height: 156px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.13);
}
.tool-hero .th-kicker {
  font-size: 12.5px;
  opacity: 0.85;
  letter-spacing: 0.04em;
}
.tool-hero .th-main {
  font-size: 21px;
  font-weight: 700;
  margin-top: 6px;
  letter-spacing: -0.01em;
}
.tool-hero .th-sub {
  font-size: 13px;
  opacity: 0.9;
  margin-top: 7px;
  line-height: 1.5;
}

.tool-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 0 14px;
}
.tool-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 15px;
  padding: 13px 14px 14px;
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 9px;
  box-shadow: var(--shadow);
  transition: transform 0.12s, background 0.12s;
  min-width: 0;
}
.tool-card:active {
  transform: scale(0.975);
  background: var(--surface-2);
}
.tool-card .tc-ico {
  width: 33px;
  height: 33px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: color-mix(in srgb, var(--c, var(--accent)) 15%, transparent);
  color: var(--c, var(--accent));
}
.tool-card .tc-ico svg {
  width: 18px;
  height: 18px;
}
.tool-card .tc-title {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.2;
}
.tool-card .tc-desc {
  font-size: 12.5px;
  color: var(--text-2);
  line-height: 1.45;
  margin-top: -3px;
}
.tool-card.wide {
  grid-column: 1 / -1;
  flex-direction: row;
  align-items: center;
  gap: 12px;
}
.tool-card.wide .tc-body {
  flex: 1;
  min-width: 0;
}
.tool-card.wide .tc-desc {
  margin-top: 3px;
}
/* 宽卡里标题和说明是普通 span，不设块级会挤成一行 */
.tool-card .tc-body .tc-title,
.tool-card .tc-body .tc-desc {
  display: block;
}
.tool-card .chev {
  color: var(--text-3);
  flex: 0 0 auto;
}
.tool-card .chev svg {
  width: 16px;
  height: 16px;
}

/* ================= 考试安排 ================= */
.exam-hero {
  margin: 14px;
  padding: 18px;
  border-radius: 18px;
  color: #fff;
  background: linear-gradient(135deg, #e5484d 0%, #f2743f 100%);
  box-shadow: 0 14px 30px -18px rgba(229, 72, 77, 0.9);
}
.exam-hero.calm {
  background: linear-gradient(135deg, #4b5563 0%, #6b7280 100%);
  box-shadow: 0 14px 30px -20px rgba(17, 24, 39, 0.7);
}
.exam-hero .eh-label {
  font-size: 12.5px;
  opacity: 0.85;
  letter-spacing: 0.04em;
}
.exam-hero .eh-name {
  font-size: 19px;
  font-weight: 700;
  margin-top: 8px;
  line-height: 1.3;
}
.exam-hero .eh-time {
  font-size: 13px;
  opacity: 0.92;
  margin-top: 6px;
}
.exam-count {
  display: flex;
  gap: 9px;
  margin-top: 16px;
}
.exam-count .ec {
  flex: 1;
  background: rgba(255, 255, 255, 0.16);
  border-radius: 12px;
  padding: 8px 0 7px;
  text-align: center;
}
.exam-count .ec b {
  display: block;
  font-size: 22px;
  font-weight: 700;
  line-height: 1.15;
  font-variant-numeric: tabular-nums;
}
.exam-count .ec span {
  font-size: 11.5px;
  opacity: 0.85;
}

.exam-list {
  padding: 4px 14px 8px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.exam-item {
  display: flex;
  gap: 12px;
  align-items: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  box-shadow: var(--shadow);
}
.ei-date {
  flex: 0 0 40px;
  text-align: center;
  color: var(--text-2);
}
.ei-date b {
  display: block;
  font-size: 21px;
  font-weight: 700;
  line-height: 1.05;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.ei-date span {
  display: block;
  font-size: 10.5px;
  color: var(--text-3);
  line-height: 1.3;
  margin-bottom: 1px;
}
.ei-main {
  flex: 1;
  min-width: 0;
}
.ei-name {
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ei-meta {
  font-size: 12.5px;
  color: var(--text-2);
  margin-top: 3px;
  display: flex;
  gap: 4px 10px;
  flex-wrap: wrap;
}
.ei-cd {
  flex: 0 0 auto;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 5px 9px;
  border-radius: 9px;
  font-variant-numeric: tabular-nums;
}
.ei-cd.soon {
  color: #e5484d;
  background: rgba(229, 72, 77, 0.12);
}
.ei-cd.now {
  color: #fff;
  background: #e5484d;
}
.ei-cd.done {
  color: var(--text-3);
  background: var(--surface-2);
}
/* 已经考完的排在后面，压暗但不清零，方便回看 */
.exam-item.done {
  opacity: 0.66;
}
.exam-item.done .ei-name {
  color: var(--text-2);
}
.exam-divide {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12px;
  color: var(--text-3);
  padding: 12px 3px 1px;
}
.exam-divide::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--border);
}

.progress {
  height: 4px;
  border-radius: 2px;
  background: var(--surface-2);
  overflow: hidden;
  margin-top: 12px;
}
.progress > i {
  display: block;
  height: 100%;
  width: 0;
  border-radius: 2px;
  background: currentColor;
  transition: width 0.25s;
}
.exam-hero .progress {
  background: rgba(255, 255, 255, 0.24);
  color: #fff;
}

/* ================= 月视图 ================= */
.mon-wrap {
  padding: 10px 12px 0;
}
.mon-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 4px 12px;
}
.mon-title {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.mon-head .spacer {
  flex: 1;
}
.mon-dow-row {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
  padding: 0 0 6px;
}
.mon-dow-row span {
  text-align: center;
  font-size: 11.5px;
  color: var(--text-3);
}
.mon-dow-row span.we {
  color: color-mix(in srgb, var(--text-3) 75%, var(--danger));
}
.mon-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}
.mon-cell {
  aspect-ratio: 1 / 1;
  border-radius: 11px;
  border: 1px solid var(--border);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  font-size: 14.5px;
  color: var(--text);
  transition: background 0.12s, transform 0.1s;
  position: relative;
  overflow: hidden;
}
.mon-cell:active {
  transform: scale(0.94);
}
.mon-cell.out {
  opacity: 0.34;
}
.mon-cell.today {
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 700;
}
.mon-cell.sel {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 700;
}
.mon-cell .mc-dots {
  display: flex;
  gap: 2.5px;
  height: 4px;
}
.mon-cell .mc-dots i {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
  opacity: 0.7;
}
.mon-cell.today .mc-dots i,
.mon-cell.sel .mc-dots i {
  background: currentColor;
  opacity: 1;
}
.mon-cell.busy {
  background: color-mix(in srgb, var(--accent) 7%, var(--surface));
}
.mon-cell.sel.busy {
  background: var(--accent);
}
.mon-legend {
  font-size: 12px;
  color: var(--text-3);
  padding: 14px 6px 20px;
  line-height: 1.7;
}

/* ================= 学期统计 ================= */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 14px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 14px;
  box-shadow: var(--shadow);
}
.stat-card b {
  display: block;
  font-size: 23px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.2;
  font-variant-numeric: tabular-nums;
}
.stat-card span {
  font-size: 12.5px;
  color: var(--text-2);
}
.stat-card b em {
  font-size: 12.5px;
  font-style: normal;
  font-weight: 500;
  color: var(--text-3);
  margin-left: 3px;
}

.bar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  margin-bottom: 11px;
}
.bar-row:last-child {
  margin-bottom: 0;
}
.bar-row .br-name {
  flex: 0 0 96px;
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bar-row .br-track {
  flex: 1;
  height: 8px;
  border-radius: 4px;
  background: var(--surface-2);
  overflow: hidden;
}
.bar-row .br-fill {
  display: block;
  height: 100%;
  border-radius: 4px;
  background: linear-gradient(90deg, #2f6bf5, #7c5cf0);
}
.bar-row .br-val {
  flex: 0 0 auto;
  font-size: 12.5px;
  color: var(--text-3);
  font-variant-numeric: tabular-nums;
}

.course-stat {
  display: block;
  padding: 13px 16px;
}
.course-stat + .course-stat {
  border-top: 1px solid var(--border);
}
.cs-head {
  display: flex;
  align-items: center;
  gap: 8px;
}
.cs-name {
  font-size: 15.5px;
  font-weight: 600;
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cs-count {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 3px 8px;
  border-radius: 8px;
  flex: 0 0 auto;
}
.cs-slots {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 9px;
}
.cs-slot {
  font-size: 12.5px;
  color: var(--text-2);
  background: var(--surface-2);
  border-radius: 8px;
  padding: 4px 9px;
}
.cs-meta {
  font-size: 12.5px;
  color: var(--text-3);
  margin-top: 8px;
  line-height: 1.5;
}

/* 周列表：第 1 周 → 最后一周 */
/* 行本身是 <a>，不显式给颜色的话会继承全局 a 的蓝色 */
.week-row {
  color: var(--text);
}
.week-row .wk-badge {
  flex: 0 0 auto;
  width: 38px;

  center: /<div\s+class="center">([\s\S]*?)<\/div>/i,
  courseList: /<ul\s+class="rl_info">([\s\S]*?)<\/ul>/i,
  listItem: /<li>([\s\S]*?)<\/li>/gi,
  sectionSpan: /<span\s+class="class_span">([\s\S]*?)<\/span>/i,
  paragraph: /<p>([\s\S]*?)<\/p>/i,
  // 日期行形如：2026-11-02 星期一（第10周）
  dateLine: /(\d{4}-\d{2}-\d{2})\s*(\S+?)（第(\d+)周）/,
};

const COLON = '[：:]'; // 兼容全角/半角冒号

class ScheduleParseError extends Error {}

// ---------- 小工具 ----------

/** 去掉所有标签 */
function stripTags(html) {
  return html.replace(/<[^>]*>/g, ' ');
}

/** 合并连续空白 */
function norm(text) {
  return text.replace(/[\s\u00a0]+/g, ' ').trim();
}

/** 从文本里按 前缀 提取字段，直到下一个字段名出现 */
function pickField(text, label) {
  const stop = `(?=时间${COLON}|地点${COLON}|教师${COLON}|$)`;
  const re = new RegExp(`${label}${COLON}([\\s\\S]*?)${stop}`);
  const m = text.match(re);
  return m ? norm(m[1]) : '';
}

/** 课程名拆解：把末尾的 (A)(上课) 这类括号内容拆成标签 */
function splitName(raw) {
  const tags = [];
  let base = raw.trim();
  const tail = /\(([^()]{1,10})\)\s*$/;
  let m;
  // 从尾部反复剥离括号内容
  while ((m = base.match(tail))) {
    tags.unshift(m[1].trim());
    base = base.slice(0, base.length - m[0].length).trim();
  }
  return { name: base || raw.trim(), tags };
}

/**
 * 判断某一周是否在周次表达式内。
 * 支持 "9"、"1-8"、"1-8,10-17"，以及偶发的 "1-16单周"/"1-16双周"。
 */
function isWeekActive(spec, week) {
  if (!spec || !week) return true; // 信息缺失时不拦截，宁可多显示
  const isOdd = /单/.test(spec);
  const isEven = /双/.test(spec);
  const pure = spec.replace(/[单双周]/g, '');

  const hit = pure.split(',').some((part) => {
    const range = part.trim().split('-').map((n) => parseInt(n, 10));
    if (range.length === 2 && !Number.isNaN(range[0]) && !Number.isNaN(range[1])) {
      return week >= range[0] && week <= range[1];
    }
    return range[0] === week;
  });

  if (!hit) return false;
  if (isOdd && week % 2 === 0) return false;
  if (isEven && week % 2 === 1) return false;
  return true;
}

// ---------- 主解析入口 ----------

/**
 * 解析"我的日历"页面。
 * @param {string} html 教务返回的 HTML
 * @returns {{ok:boolean, needBind?:boolean, date?:string, weekday?:string,
 *            weekNumber?:number, courses?:Array, warnings?:string[]}}
 */
function parseSchedulePage(html) {
  if (typeof html !== 'string' || html.length === 0) {
    throw new ScheduleParseError('页面内容为空');
  }

  const title = norm(stripTags((html.match(PATTERNS.title) || [, ''])[1]));

  // 未绑定 / ID 失效：教务返回的是绑定页
  if (/绑定/.test(title)) {
    return { ok: false, needBind: true, message: '微信凭证无效，需要重新绑定' };
  }
  if (!/日历/.test(title)) {
    throw new ScheduleParseError(`无法识别的页面标题：${title || '(空)'}`);
  }

  const warnings = [];

  // ---- 日期行 ----
  const centerBlock = (html.match(PATTERNS.center) || [, ''])[1];
  const centerText = norm(stripTags(centerBlock));
  const dateMatch = centerText.match(PATTERNS.dateLine);

  let date = '';
  let weekday = '';
  let weekNumber = null;

  if (dateMatch) {
    [, date, weekday, weekNumber] = dateMatch;
    weekNumber = parseInt(weekNumber, 10);
  } else {
    warnings.push('日期格式无法识别：' + (centerText || '(空)'));
  }

  // ---- 课程列表 ----
  const listBlock = html.match(PATTERNS.courseList);
  if (!listBlock) {
    throw new ScheduleParseError('页面结构异常：未找到 ul.rl_info 课程列表');
  }

  const courses = [];
  // 注意：带 /g 的 match 返回完整匹配片段数组，这里每一项本身就是 <li>...</li>
  const items = listBlock[1].match(PATTERNS.listItem) || [];

  for (const item of items) {

    // 无课日（周末/节假日）这里放的是 easy1.png 之类的装饰图，跳过
    if (/<img/i.test(item)) continue;

    const sectionMatch = item.match(PATTERNS.sectionSpan);
    if (!sectionMatch) continue; // 没有节次就不是课程条目

    const section = norm(stripTags(sectionMatch[1])).replace(/\s+/g, ''); // "1-2节"

    // 把 span 那一块摘掉，剩下的是「课程名 + 时间/地点/教师」
    const paraMatch = item.match(PATTERNS.paragraph);
    if (!paraMatch) continue;
    const withoutSpan = paraMatch[1].replace(/<span[\s\S]*?<\/span>/i, ' ');
    const text = norm(stripTags(withoutSpan));

    const timeAt = text.search(new RegExp(`时间${COLON}`));
    const nameRaw = (timeAt >= 0 ? text.slice(0, timeAt) : text).trim();
    if (!nameRaw) continue;

    const { name, tags } = splitName(nameRaw);
    const timeRaw = pickField(text, '时间');
    const location = pickField(text, '地点');
    const teacher = pickField(text, '教师');

    // timeRaw 形如 "1-8,10-17 1,2"：前半是周次，后半是节次
    const [weekSpec = '', periodSpec = ''] = timeRaw.split(/\s+/);
    const periods = periodSpec
      .split(',')
      .map((n) => parseInt(n, 10))
      .filter((n) => !Number.isNaN(n));

    courses.push({
      section, // "1-2节"
      startPeriod: periods[0] || 99, // 排序用
      periods,
      name,
      tags,
      weekSpec, // "1-8,10-17"
      location,
      teacher,
      activeThisWeek: isWeekActive(weekSpec, weekNumber),
      rawName: nameRaw,
    });
  }

  courses.sort((a, b) => a.startPeriod - b.startPeriod);

  if (courses.length === 0 && items.length === 0) {
    warnings.push('课程列表为空且无装饰图，页面结构可能已变化');
  }

  return { ok: true, date, weekday, weekNumber, courses, warnings };
}

/**
 * 解析校历页面（xiaoli.html），返回图片绝对地址。
 * @param {string} html
 * @param {string} baseUrl 例：https://jwxt.ecjtu.edu.cn/weixin/
 */
function parseAcademicCalendar(html, baseUrl = 'https://jwxt.ecjtu.edu.cn/weixin/') {
  // 页面里有被注释掉的旧图，先删掉注释避免误取
  const cleaned = html.replace(/<!--[\s\S]*?-->/g, '');
  const m = cleaned.match(/<img[^>]+src="([^"]+)"/i);
  if (!m) throw new ScheduleParseError('校历页面中未找到图片');
  return new URL(m[1], baseUrl).href;
}

/**
 * 从用户粘贴的任意内容里提取 weiXinID。
 * 支持：完整链接、带了额外参数的链接、甚至是重复粘贴的两行文本。
 */
function extractWeiXinId(input) {
  if (!input) return null;
  const m = String(input).match(/weiXinID=([A-Za-z0-9_-]{6,})/i);
  return m ? m[1] : null;
}

(function () {
/**
 * 周视图网格构建（纯函数，不碰 DOM，便于单测）
 * 输入一周 7 天 + 各自的课表数据，输出 CSS Grid 的 HTML 片段。
 */

const DOW_LABEL = ['一', '二', '三', '四', '五', '六', '日'];
const BAR_COLORS = ['#2f6bf5', '#7c5cf0', '#e5694b', '#16a085', '#d9880f', '#c2410c'];
const ROW_HEIGHT = 30; // 与 styles.css 的 grid-template-rows 保持一致

/** 兼容旧版/异常缓存：courses 缺失时当作空数组，绝不让整周渲染抛错 */
function coursesOf(dt) {
  return Array.isArray(dt?.courses) ? dt.courses : [];
}

function colorForPeriod(startPeriod) {
  const idx = Math.min(Math.floor((startPeriod - 1) / 2), BAR_COLORS.length - 1);
  return BAR_COLORS[Math.max(0, idx)];
}

/**
 * @param {object} opts
 * @param {Date[]} opts.days 一周 7 天
 * @param {(Array|null)[]} opts.datas 与 days 对齐的课表数据，未加载为 null
 * @param {string} opts.selectedKey 选中日期 'YYYY-MM-DD'
 * @param {number} [opts.loadingCount] 还在加载的天数，>0 时显示提示
 * @param {Set<string>} [opts.errored] 拉取失败的日期 key，整列显示「加载失败」
 * @returns {{ html:string, blocks:Map<string, object>, rows:number }}
 */
function buildWeekGridHtml({
  days,
  datas,
  selectedKey,
  loadingCount = 0,
  errored = new Set(),
}) {
  // 1. 决定需要多少节次行（至少 10 节，偶数行便于两节一组显示）
  let maxPeriod = 10;
  datas.forEach((dt) =>
    coursesOf(dt).forEach((c) => {
      const end = c.startPeriod - 1 + Math.max(1, c.periods.length);
      if (end > maxPeriod) maxPeriod = end;
    }),
  );
  if (maxPeriod % 2) maxPeriod += 1;
  const rows = Math.max(10, maxPeriod);

  const cells = [];
  cells.push(`<div class="wg-corner" style="grid-row:1;grid-column:1"></div>`);

  // 0. 底纹先入 DOM，保证画在课程块下面：
  //    每两节一组隔行浅底，今天那一列再叠一层淡色，扫一眼就能定位
  for (let g = 1; g < rows / 2; g += 2) {
    cells.push(`<div class="wg-band alt" style="grid-row:${2 + g * 2}/span 2;grid-column:2/-1"></div>`);
  }
  const todayIdx = days.findIndex((d) => isToday(d));
  if (todayIdx >= 0) {
    cells.push(
      `<div class="wg-band today" style="grid-row:2/span ${rows};grid-column:${todayIdx + 2}"></div>`,
    );
  }

  // 2. 表头（周一~周日）
  days.forEach((d, i) => {
    const key = toKey(d);
    const cls = ['wg-head', isToday(d) ? 'is-today' : '', key === selectedKey ? 'is-sel' : '']
      .filter(Boolean)
      .join(' ');
    cells.push(
      `<button class="${cls}" data-key="${key}" style="grid-row:1;grid-column:${i + 2}">
        <span class="wd">${DOW_LABEL[i]}</span>
        <span class="dn">${d.getDate()}</span>
      </button>`,
    );
  });

  // 3. 左侧节次轴，每两节一组（grid-row 从 2 开始，1 被表头占用）
  for (let g = 0; g < rows / 2; g++) {
    cells.push(
      `<div class="wg-time" style="grid-row:${2 + g * 2}/span 2;grid-column:1">${
        g * 2 + 1
      }-${g * 2 + 2}</div>`,
    );
  }

  // 4. 课程块
  const blocks = new Map();
  days.forEach((d, i) => {
    const key = toKey(d);
    const dt = datas[i];
    if (!dt) return;
    coursesOf(dt).forEach((c, idx) => {
      const span = Math.max(1, c.periods.length);
      const rowStart = 2 + (c.startPeriod - 1);
      const id = `${key}|${idx}`;
      blocks.set(id, c);

      const dim = c.activeThisWeek === false ? ' inactive' : '';
      const single = span < 2 ? ' span1' : '';
      cells.push(
        `<button class="course-block${dim}${single}" data-block="${id}"
           style="grid-column:${i + 2};grid-row:${rowStart}/span ${span};background:${colorForPeriod(
             c.startPeriod,
           )}">
          <span class="cb-name">${escapeHtml(c.name)}</span>
          ${c.location ? `<span class="cb-loc">${escapeHtml(c.location)}</span>` : ''}
        </button>`,
      );
    });
  });

  // 5. 尚未加载的天：整列占位；拉取失败的给可点重试的整列，区分「在转」和「挂了」
  days.forEach((d, i) => {
    if (datas[i]) return;
    const key = toKey(d);
    if (errored.has(key)) {
      cells.push(
        `<button class="wg-fail" data-retry="${key}" style="grid-column:${i + 2};grid-row:2/span ${rows}">
          <span class="wf-t">加载失败</span><span class="wf-s">点此重试</span>
        </button>`,
      );
      return;
    }
    cells.push(
      `<div class="wg-empty" style="grid-column:${i + 2};grid-row:2/span ${rows}"><span>···</span></div>`,
    );
  });

  const hint = loadingCount
    ? `<div class="refresh-hint">正在加载 ${loadingCount} 天的课程…</div>`
    : '';

  // 7 天都加载完却一节课都没有：明确告诉用户「本周没课」，
  // 否则空网格会和「还没加载完」混淆
  const allLoaded = datas.every((d) => d);
  const emptyWeekTip =
    allLoaded && blocks.size === 0 ? `<div class="week-empty-tip">本周没有课程安排</div>` : '';

  return {
    html: `${hint}${emptyWeekTip}<div class="week-grid" style="--rows:${rows}">${cells.join('')}</div>`,
    blocks,
    rows,
  };
}



__mods["weekview"] = { DOW_LABEL, ROW_HEIGHT, colorForPeriod, buildWeekGridHtml };

(function () {
/**
 * 本地存储封装。
 * 说明：weiXinID 等同于课表查询凭证，这里存在 localStorage 明文，
 * 与安卓版行为一致。不要在公共电脑上绑定。
 *
 * 重要：内存里保留一份镜像，localStorage 只作为「持久化备份」。
 * 原因：localStorage 会静默失败（配额满、无痕模式、缓存 JSON 损坏），
 * 如果渲染层直接回读 localStorage，就会出现「日视图有课、周视图全空」。
 */

const KEY_ID = 'huajiao.weixinId';
const KEY_CACHE = 'huajiao.scheduleCache.v1';
const CACHE_TTL = 6 * 60 * 60 * 1000; // 6 小时内直接用缓存，过期后台刷新
const MAX_DAYS = 40;

/** dateKey -> { ts, data }，本次会话的权威数据源 */
const mem = new Map();

/** 读磁盘缓存，解析失败就当作空（损坏的 JSON 不该永久污染后续读写） */
function readDisk() {
  try {
    const raw = localStorage.getItem(KEY_CACHE);
    if (!raw) return {};
    const obj = JSON.parse(raw);
    return obj && typeof obj === 'object' ? obj : {};
  } catch {
    return {};
  }
}

function pruneMem() {
  if (mem.size <= MAX_DAYS) return;
  const entries = [...mem.entries()].sort((a, b) => (a[1]?.ts || 0) - (b[1]?.ts || 0));
  while (entries.length > MAX_DAYS) mem.delete(entries.shift()[0]);
}

const store = {
  getWeiXinId() {
    try {
      return localStorage.getItem(KEY_ID) || '';
    } catch {
      return '';
    }
  },

  setWeiXinId(id) {
    try {
      localStorage.setItem(KEY_ID, id);
    } catch {
      // 存不下也不影响本次会话
    }
  },

  clearId() {
    try {
      localStorage.removeItem(KEY_ID);
    } catch {
      /* ignore */
    }
  },

  /** 读取某天缓存，返回 { fresh:boolean, data } 或 null。内存优先。 */
  readCache(dateKey) {
    let hit = mem.get(dateKey);

      if (!disk) return null;
      hit = disk;
      mem.set(dateKey, hit);
    }
    const ts = Number(hit.ts) || 0;
    return { data: hit.data, fresh: Date.now() - ts < CACHE_TTL };
  },

  writeCache(dateKey, data) {

    mem.set(dateKey, entry);

    try {
      const all = readDisk();
      all[dateKey] = entry;
      const keys = Object.keys(all).sort();
      while (keys.length > MAX_DAYS) delete all[keys.shift()];
      localStorage.setItem(KEY_CACHE, JSON.stringify(all));
    } catch {
      // 写不进磁盘就只留内存，功能不受影响
    }
  },

  clearCache() {
    mem.clear();
    try {
      localStorage.removeItem(KEY_CACHE);
    } catch {
      /* ignore */
    }

  },
};

async function fetchHtml(path, params = {}) {
  const url = new URL(path, JWXT);
  for (const [k, v] of Object.entries(params)) {
    if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, v);
  }

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);

  let res;
  try {
    res = await fetch(`${PROXY}?url=${encodeURIComponent(url.href)}`, { signal: ctrl.signal });
  } catch (err) {
    throw new Error(
      err?.name === 'AbortError'
        ? '请求教务系统超时，请稍后重试'
        : '无法连接本地代理，请确认服务已启动',
    );
  } finally {
    clearTimeout(timer);
  }

  const data = await res.json().catch(() => ({}));
  if (!res.ok || !data.ok) {
    throw new Error(data.error || `请求失败（HTTP ${res.status}）`);

  return data.html;

        <div id="list"></div>
      </div>`,
  });

  const strip = root.querySelector('#strip');
  const page = root.querySelector('#page');
  const main = root.querySelector('main');
  const dayTitle = root.querySelector('#day-title');
  const list = root.querySelector('#list');
  const weekLabel = root.querySelector('#week-label');
  const monthLabel = root.querySelector('#month-label');
  const dayMain = root.querySelector('#day-main');
  const daySub = root.querySelector('#day-sub');
  const viewSwitch = root.querySelector('#view-switch');
  const todayChip = root.querySelector('#btn-today');

  // ---------- 数据 ----------

  /** 取某天数据，带 in-flight 去重；fresh 缓存命中时不发请求 */
  function getDayData(dateKey, { force = false } = {}) {
    if (!force) {
      const cached = store.readCache(dateKey);
      if (cached?.fresh) return Promise.resolve(cached.data);
    }
    if (inflight.has(dateKey)) return inflight.get(dateKey);

    const p = fetchSchedule(ctx.weiXinId, dateKey)
      .then((data) => {
        // 统一形状：courses 一定是数组，避免脏数据在周视图里连锁报错
        const safe = { ...data, courses: Array.isArray(data.courses) ? data.courses : [] };
        store.writeCache(dateKey, safe);
        dots.set(dateKey, safe.courses.length > 0);
        // 今天是小组件的数据源，拉到就顺手推一份
        if (dateKey === toKey(new Date())) {
          try {
            __mods["widgetdata"].push();
          } catch (e) {
            /* 网页版忽略 */
          }
        }
        return safe;
      })
      .finally(() => inflight.delete(dateKey));

    inflight.set(dateKey, p);
    return p;
  }

  function weekDays() {
    return Array.from({ length: 7 }, (_, i) => addDays(weekStart, i));
  }

  // ---------- 日视图 ----------

  function renderStrip() {
    const days = weekDays();
    strip.innerHTML = days
      .map((d, i) => {
        const key = toKey(d);
        const cls = [
          'day-cell',
          toKey(selected) === key ? 'selected' : '',
          isToday(d) ? 'is-today' : '',
          dots.get(key) ? 'has-class' : '',
        ]
          .filter(Boolean)
          .join(' ');
        const showMonth = i === 0 || d.getDate() === 1;
        return `<button class="${cls}" data-key="${key}">
          <span class="dow">${showMonth ? `${d.getMonth() + 1}月` : DOW_LABEL[i]}</span>
          <span class="num">${d.getDate()}</span>
          <span class="dot"></span>
        </button>`;
      })
      .join('');

    monthLabel.textContent = ` · ${selected.getFullYear()}年${selected.getMonth() + 1}月`;
    dayMain.textContent = `${selected.getMonth() + 1}月${selected.getDate()}日`;
    setDaySub();
    syncTodayChip();
  }

  /** 日期标题下的那行小字：星期X · 第N周 · 今天 */
  function setDaySub(no) {
    const isTd = toKey(selected) === toKey(new Date());
    daySub.textContent = [
      `星期${WEEKDAY_CN[selected.getDay()]}`,
      no ? `第${no}周` : '',
      isTd ? '今天' : '',
    ]
      .filter(Boolean)
      .join(' · ');
  }

  function renderState({ emoji, title, desc, actions = '' }) {
    list.innerHTML = `<div class="state">
      ${emoji ? `<div class="emoji">${emoji}</div>` : ''}
      <div class="title">${escapeHtml(title)}</div>
      <div class="desc">${desc}</div>
      ${actions ? `<div class="actions">${actions}</div>` : ''}
    </div>`;
  }

  function renderCourses(data) {
    const courses = Array.isArray(data?.courses) ? data.courses : [];
    if (!courses.length) {
      const weekend = [0, 6].includes(selected.getDay());
      renderState({
        emoji: weekend ? '☕' : '🌤',
        title: '这天没有课',
        desc: weekend ? '周末好好休息' : '可以去做点自己的事',
      });
      return;
    }
    dayCourses = courses;
    list.innerHTML = `<div class="course-list">
      ${courses.map((c, i) => courseCard(c, i)).join('')}
    </div>`;

    if (data.weekNumber) {
      setWeekLabel(selected, data.weekNumber);
      setDaySub(data.weekNumber);
    }
  }

  async function loadDay(dateKey, { force = false } = {}) {
    const my = ++dayToken;
    const cached = store.readCache(dateKey);
    // 先按锚点把周次刷一遍：翻到没有数据的日子时标签不会停在上一个值
    setWeekLabel(selected);

    if (cached && !force) {
      renderCourses(cached.data);
      if (cached.data.weekNumber) setWeekLabel(selected, cached.data.weekNumber);
      if (cached.fresh) return;
    } else {
      list.innerHTML = skeletonHtml();
    }

    try {
      const data = await getDayData(dateKey, { force });
      if (my !== dayToken) return;
      if (mode !== 'day') return; // 已经切到周视图，迟到的响应不能覆盖网格
      setWeekLabel(selected, data.weekNumber);
      renderCourses(data);
      if (force) toast('已刷新');
    } catch (err) {
      if (my !== dayToken) return;
      if (mode !== 'day') return;
      if (err instanceof NeedBindError) {
        toast(err.message);
        location.hash = '#/bind';
        return;
      }
      if (cached) {
        toast('刷新失败，显示的是缓存');
        return;
      }
      renderState({
        emoji: '⚠️',
        title: '加载失败',
        desc: escapeHtml(err.message || '未知错误'),
        actions: `<button class="btn" id="retry">重试</button>`,
      });
      list
        .querySelector('#retry')
        ?.addEventListener('click', () => loadDay(dateKey, { force: true }));
    }
  }

  // ---------- 周视图 ----------

  // `${dateKey}|${索引}` -> 课程对象，供点击详情使用
  let blockIndex = new Map();
  // 本周拉取失败的日期，用于把「还在转」和「挂了」区分开
  const errored = new Set();

  function buildWeekGrid(loadingKeys) {
    const days = weekDays();
    const datas = days.map((d) => store.readCache(toKey(d))?.data || null);
    const { html, blocks } = buildWeekGridHtml({
      days,
      datas,
      selectedKey: toKey(selected),
      loadingCount: loadingKeys.size,
      errored,
    });
    blockIndex = blocks;
    return html;
  }

  async function loadWeek({ force = false } = {}) {
    const my = ++weekToken;
    const days = weekDays();
    // force 时全部重拉，否则只补缺失的天
    const missing = days.filter((d) => force || !store.readCache(toKey(d)));
    const loadingKeys = new Set(missing.map((d) => toKey(d)));
    errored.clear();

    const paint = () => {
      if (mode !== 'week') return; // 已经切回日视图就别再覆盖 DOM
      const weekNo = days
        .map((d) => store.readCache(toKey(d))?.data?.weekNumber)
        .find((n) => n);
      // 新一周还没拉到数据时，用锚点推算，别让标签停在上一次的值
      setWeekLabel(days[0], weekNo);
      // 周视图里给个日期范围，翻周时心里有数
      monthLabel.textContent = ` · ${days[0].getMonth() + 1}/${days[0].getDate()} - ${
        days[6].getMonth() + 1
      }/${days[6].getDate()}`;
      syncTodayChip();
      // 渲染到 #list 而不是 #page，否则切回日视图时容器会被销毁
      list.innerHTML = buildWeekGrid(loadingKeys);
      bindGridEvents();
    };

    paint();
    if (!missing.length) return;

    // 逐天返回逐天重画：某一天慢或失败，不会让整周一直停在占位状态
    await Promise.all(
      missing.map(async (d) => {
        const key = toKey(d);
        try {
          await getDayData(key, { force });
        } catch (err) {
          errored.add(key);
          if (err instanceof NeedBindError) {
            toast(err.message);
            location.hash = '#/bind';
          }
        } finally {
          loadingKeys.delete(key);
          if (my === weekToken) paint();
        }
      }),
    );

    if (my !== weekToken) return;
    paint();
  }

  function bindGridEvents() {
    const grid = list.querySelector('.week-grid');
    if (!grid) return;

    grid.addEventListener('click', (e) => {
      const fail = e.target.closest('.wg-fail');
      if (fail) {
        errored.delete(fail.dataset.retry);
        loadWeek();
        return;
      }
      const block = e.target.closest('.course-block');
      if (block) {
        const course = blockIndex.get(block.dataset.block);
        if (course) showCourseSheet(course, block.dataset.block.split('|')[0]);
        return;
      }
      const head = e.target.closest('.wg-head');
      if (head) {
        // 点表头切到那一天的日视图（setMode 内部已包含重绘与加载）
        const [y, m, d] = head.dataset.key.split('-').map(Number);
        selected = new Date(y, m - 1, d);
        setMode('day');
      }
    });
  }

  // ---------- 课程详情浮层 ----------

  function showCourseSheet(course, dateKey) {
    const [y, m, d] = dateKey.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    const rows = [
      ['节次', course.section],
      ['时间', course.weekSpec ? `${course.weekSpec}周` : '—'],
      ['地点', course.location || '—'],
      ['教师', course.teacher || '—'],
    ];

    const el = document.createElement('div');
    el.className = 'sheet-wrap';
    el.innerHTML = `
      <div class="sheet-mask"></div>
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-head">
          <span class="section" style="background:${barColor(course.startPeriod)}1f;color:${barColor(
            course.startPeriod,
          )}">${escapeHtml(course.section)}</span>
          <span class="sheet-date">${m}月${d}日 星期${WEEKDAY_CN[date.getDay()]}</span>
        </div>
        <h3>${escapeHtml(course.name)}</h3>
        <dl>
          ${rows
            .map(
              ([k, v]) =>
                `<div><dt>${k}</dt><dd>${escapeHtml(v)}</dd></div>`,
            )
            .join('')}
        </dl>
        ${
          (course.tags || []).length
            ? `<div class="sheet-tags">${course.tags
                .map((t) => `<span class="tag">${escapeHtml(t)}</span>`)
                .join('')}</div>`
            : ''
        }
        ${
          course.activeThisWeek === false
            ? '<p class="sheet-warn">该课程本周不在排课周次内</p>'
            : ''
        }
      </div>`;

    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('open'));

    const close = () => {
      el.classList.remove('open');
      setTimeout(() => el.remove(), 220);
    };
    el.querySelector('.sheet-mask').addEventListener('click', close);
    el.querySelector('.sheet').addEventListener('click', (e) => e.stopPropagation());
  }

  // ---------- 模式切换 ----------

  /** 周内偏移：周一=0 … 周日=6 */
  function dayOffset(date) {
    return (date.getDay() + 6) % 7;
  }

  function setMode(next) {
    mode = next;
    localStorage.setItem(MODE_KEY, next);
    viewSwitch.querySelectorAll('button').forEach((b) => {
      b.classList.toggle('active', b.dataset.mode === next);
    });
    page.classList.toggle('week-mode', next === 'week');
    window.scrollTo(0, 0);

    // 两种视图共用一个 weekStart：切换时一律以「当前选中日期所在周」为准
    weekStart = startOfWeekMonday(selected);

    if (mode === 'day') {
      strip.style.display = '';
      dayTitle.style.display = '';
      renderStrip();
      loadDay(toKey(selected));
      prefetchWeek(weekStart);
    } else {
      strip.style.display = 'none';
      dayTitle.style.display = 'none';
      loadWeek();
    }
  }

  // ---------- 交互 ----------

  function refreshAll() {
    if (mode === 'day') {
      renderStrip();
      loadDay(toKey(selected));
      prefetchWeek(weekStart);
    } else {
      // 不强制刷新：来回切周时应命中缓存，秒开
      loadWeek();
    }
  }

  /** 后台把某一周 7 天全部补齐，让周视图切换时直接命中缓存 */
  function prefetchWeek(start) {
    const selKey = toKey(selected);
    const startKey = toKey(start);
    for (let i = 0; i < 7; i++) {
      const key = toKey(addDays(start, i));
      if (key === selKey) continue; // 选中的那天交给 loadDay
      if (store.readCache(key)?.fresh) continue;
      getDayData(key)
        .then(() => {
          if (mode === 'day' && toKey(weekStart) === startKey) renderStrip();
        })
        .catch(() => {});
    }
  }

  /** 切周：保持星期几不变（周五翻页之后还是周五） */
  function shiftWeek(delta) {
    const offset = dayOffset(selected);
    weekStart = addDays(weekStart, delta * 7);
    selected = addDays(weekStart, offset);
    refreshAll();
  }

  // ---------- 左右滑动 ----------
  //
  // 老问题：监听挂在 main 上、只靠 touchmove 判断位移，结果浏览器先把横向拖动
  // 当成滚动/回弹消耗掉，只有盖在课程块这种元素上时才轮到 JS 处理 —— 就是
  // 「只有在有课的地方能滑」的由来；同时翻页动画的 translateX 把文档撑宽，
  // 整个 WebView 会跟着左右蹭（「整体晃动」）。
  //
  // 现在三件事一起做：
  //   1. main 上 touch-action: pan-y —— 横向手势明确归 JS，纵向仍交给滚动；
  //   2. touchmove 里一旦判定为横向就 preventDefault，彻底断掉滚动接管；
  //   3. 手指移动时内容带阻尼跟手，松手再决定翻页还是弹回。

  /** 换页时给内容一个短促的滑入，让「翻过去」这件事有反馈 */
  function animateSlide(dir) {
    page.classList.remove('slide-left', 'slide-right');
    void page.offsetWidth; // 强制重排，连续滑动时动画能重新触发
    page.classList.add(dir > 0 ? 'slide-left' : 'slide-right');
    setTimeout(() => page.classList.remove('slide-left', 'slide-right'), 280);
  }

  /** dir=1 下一页（左滑），dir=-1 上一页（右滑） */
  function stepPage(dir) {
    if (mode === 'week') {
      shiftWeek(dir);
    } else {
      selected = addDays(selected, dir);
      weekStart = startOfWeekMonday(selected); // 跨周时日期条一起翻
      renderStrip();
      loadDay(toKey(selected));
      prefetchWeek(weekStart);
    }
    animateSlide(dir);
  }

  (function bindSwipe() {
    const FOLLOW = 0.42; // 跟手阻尼
    const MAX_FOLLOW = 80; // 跟手上限，避免拖太远露馅
    const START_SLOP = 10; // 多大位移才开始判定方向
    const FLIP_DIST = 52; // 滑过这个距离就翻页
    const FLICK_DIST = 26; // 快速轻扫的距离门槛
    const FLICK_MS = 260;

    let active = false;
    let axis = null; // null / 'x' / 'y'
    let sx = 0;
    let sy = 0;
    let st = 0;
    let dxLast = 0;

    const setShift = (px) => {
      page.style.transform = px ? `translate3d(${px}px, 0, 0)` : '';
    };

    /** 弹性弹回：先加过渡类，下一帧再改值，过渡才会真正跑起来 */
    function snapBack() {
      page.classList.add('snap-back');
      requestAnimationFrame(() => setShift(0));
      setTimeout(() => {
        page.classList.remove('snap-back');
        setShift(0);
      }, 240);
    }

    /** 有些区域不该抢手势：底部标签栏、课程详情浮层、校历缩放区 */
    function blocked(target) {
      return !!(target && target.closest && target.closest('.tabbar, .sheet-wrap, .cal-wrap'));
    }

    // 监听挂在 #app（root）上而不是 main：
    // 日视图课少的时候 main 只有半屏高，下面那片空白属于 #app，
    // 按在那里的事件根本到不了 main —— 这就是「空白处滑不动」。
    // root 每次进页面都会被复用，所以先把上一次的监听摘掉，避免叠加。
    const swipeTarget = root;
    if (swipeTarget.__swipeOff) swipeTarget.__swipeOff();

    const onStart = (e) => {
      if (e.touches.length !== 1 || blocked(e.target)) {
        active = false;
        axis = null;
        return;
      }
      sx = e.touches[0].clientX;
      sy = e.touches[0].clientY;
      st = Date.now();
      dxLast = 0;
      axis = null;
      active = true;
    };

    const onMove = (e) => {
      if (!active || e.touches.length !== 1) return;
      const dx = e.touches[0].clientX - sx;
      const dy = e.touches[0].clientY - sy;

      // 方向锁定：先动够 10px 再判断，之后这一下就只认一个方向
      if (!axis) {
        if (Math.abs(dx) < START_SLOP && Math.abs(dy) < START_SLOP) return;
        axis = Math.abs(dx) > Math.abs(dy) * 1.2 ? 'x' : 'y';
        if (axis === 'x') page.classList.add('dragging');
      }
      if (axis !== 'x') return;

      // 横向意图已确定：拦掉浏览器的滚动/回弹接管
      if (e.cancelable) e.preventDefault();
      dxLast = dx;
      setShift(Math.max(-MAX_FOLLOW, Math.min(MAX_FOLLOW, dx * FOLLOW)));
    };

    function endSwipe() {
      if (!active) return;
      active = false;
      const wasX = axis === 'x';
      const dist = dxLast;
      const ms = Date.now() - st;
      axis = null;

      page.classList.remove('dragging');
      if (!wasX) {
        setShift(0);
        return;
      }

      const far = Math.abs(dist) > FLIP_DIST;
      const flick = Math.abs(dist) > FLICK_DIST && ms < FLICK_MS;
      if (far || flick) {
        setShift(0); // 先归位，再交给滑入动画
        stepPage(dist < 0 ? 1 : -1);
      } else {
        snapBack();
      }
      dxLast = 0;
    }

    swipeTarget.addEventListener('touchstart', onStart, { passive: true });
    swipeTarget.addEventListener('touchmove', onMove, { passive: false });
    swipeTarget.addEventListener('touchend', endSwipe, { passive: true });
    swipeTarget.addEventListener('touchcancel', endSwipe, { passive: true });
    swipeTarget.__swipeOff = () => {
      swipeTarget.removeEventListener('touchstart', onStart);
      swipeTarget.removeEventListener('touchmove', onMove);
      swipeTarget.removeEventListener('touchend', endSwipe);
      swipeTarget.removeEventListener('touchcancel', endSwipe);
      swipeTarget.__swipeOff = null;
    };
  })();

  // 日视图卡片点击 → 课程详情（和周视图的课程块保持一致）
  list.addEventListener('click', (e) => {
    const card = e.target.closest('.course-card');
    if (!card) return;
    const course = dayCourses[Number(card.dataset.idx)];
    if (course) showCourseSheet(course, toKey(selected));
  });

  strip.addEventListener('click', (e) => {
    const cell = e.target.closest('.day-cell');
    if (!cell) return;
    const [y, m, d] = cell.dataset.key.split('-').map(Number);
    selected = new Date(y, m - 1, d);
    renderStrip();
    loadDay(cell.dataset.key);
  });

  root.querySelector('#btn-prev').addEventListener('click', () => shiftWeek(-1));
  root.querySelector('#btn-next').addEventListener('click', () => shiftWeek(1));

  root.querySelector('#btn-today').addEventListener('click', () => {
    const today = new Date();
    weekStart = startOfWeekMonday(today);
    selected = today;
    refreshAll();
  });

  root.querySelector('#btn-refresh').addEventListener('click', () => {
    if (mode === 'day') loadDay(toKey(selected), { force: true });
    else loadWeek({ force: true });
  });

  viewSwitch.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn || btn.dataset.mode === mode) return;
    setMode(btn.dataset.mode);
  });

  // ---------- 首屏 ----------
  setMode(mode);
}

__mods["calendar"] = { mount };
})();

/* ===== views/academic.js ===== */
(function () {
/** 校历页：教务校历是一张图，支持双指/双击/按钮缩放 + 拖动 */
const { fetchAcademicCalendarImage } = __mods["api"];
const { icon, escapeHtml, layout, toast } = __mods["ui"];

const CACHE_KEY = 'huajiao.academicImg';
const MIN_SCALE = 1;
const MAX_SCALE = 4;

function mount(root, ctx) {
  root.innerHTML = layout({
    title: '教学日历',
    tab: 'tools',
    back: true,
    actions: `<button class="icon-btn" id="btn-refresh" title="刷新">${icon.refresh}</button>`,
    content: `
      <div id="stage"></div>
      <div class="zoom-bar" id="zoom-bar" hidden>
        <button id="z-in" title="放大">${icon.plus}</button>
        <button id="z-out" title="缩小">${icon.minus}</button>
        <button id="z-fit" title="还原">${icon.fit}</button>
      </div>`,
  });

  const stage = root.querySelector('#stage');
  const bar = root.querySelector('#zoom-bar');

  let scale = 1;
  let tx = 0;
  let ty = 0;
  let wrap = null;
  let img = null;

  // ---------- 缩放核心 ----------

  function baseW() {
    return wrap ? wrap.clientWidth : 0;
  }

  /** 图片铺满宽度后的显示高度 */
  function baseH() {
    if (!img || !img.naturalWidth) return wrap ? wrap.clientHeight : 0;
    return (baseW() * img.naturalHeight) / img.naturalWidth;
  }

  function clampPan() {
    const w = baseW();
    const h = baseH();
    const sw = w * scale;
    const sh = h * scale;
    // 图片比容器小的方向不允许拖动，避免拖出空白
    const minX = Math.min(0, w - sw);
    const minY = Math.min(0, h - sh);
    tx = Math.min(0, Math.max(minX, tx));
    ty = Math.min(0, Math.max(minY, ty));
  }

  function render() {
    if (!wrap || !img) return;
    clampPan();
    img.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${scale})`;
    wrap.classList.toggle('zoomed', scale > MIN_SCALE + 0.001);
    bar.querySelector('#z-in').disabled = scale >= MAX_SCALE - 0.001;
    bar.querySelector('#z-out').disabled = scale <= MIN_SCALE + 0.001;
  }

  /** 以容器内 (px,py) 这一点为锚点缩放到 next */
  function zoomAt(px, py, next) {
    const s = Math.min(MAX_SCALE, Math.max(MIN_SCALE, next));
    if (Math.abs(s - scale) < 0.0005) return;
    tx = px - (px - tx) * (s / scale);
    ty = py - (py - ty) * (s / scale);
    scale = s;
    if (scale <= MIN_SCALE + 0.001) {
      scale = MIN_SCALE;
      tx = 0;
      ty = 0;
    }
    render();
  }

  function reset() {
    scale = MIN_SCALE;
    tx = 0;
    ty = 0;
    render();
  }

  /** 当前视野中心（换算到容器坐标），按钮缩放往这儿对齐 */
  function viewCenter() {
    const r = wrap.getBoundingClientRect();
    const x = Math.min(Math.max(window.innerWidth / 2 - r.left, 0), wrap.clientWidth);
    const y = Math.min(Math.max(window.innerHeight / 2 - r.top, 0), wrap.clientHeight);
    return { x, y };
  }

  function attachZoom() {
    wrap = stage.querySelector('#cal-wrap');
    img = stage.querySelector('#cal-img');
    if (!wrap || !img) return;

    scale = MIN_SCALE;
    tx = 0;
    ty = 0;
    bar.hidden = false;
    render();

    const pts = new Map();
    let startDist = 0;
    let startScale = 1;
    let startMid = { x: 0, y: 0 };
    let panStart = null;
    let moved = false;
    let lastTap = 0;
    // 这一轮手势用过双指：抬手时不能再当成双击，否则双指缩放刚松手就被还原
    let multiGesture = false;

    const local = (clientX, clientY) => {
      const r = wrap.getBoundingClientRect();
      return { x: clientX - r.left, y: clientY - r.top };
    };

    wrap.addEventListener('pointerdown', (e) => {
      try {
        wrap.setPointerCapture(e.pointerId);
      } catch {
        /* 老设备忽略 */
      }
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pts.size === 2) {
        const [a, b] = [...pts.values()];
        startDist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
        startScale = scale;
        startMid = local((a.x + b.x) / 2, (a.y + b.y) / 2);
        panStart = null;
        multiGesture = true;
      } else if (pts.size === 1) {
        panStart = { x: e.clientX, y: e.clientY, tx, ty };
        moved = false;
      }
    });

    wrap.addEventListener('pointermove', (e) => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pts.size >= 2) {
        const [a, b] = [...pts.values()];
        const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
        const mid = local((a.x + b.x) / 2, (a.y + b.y) / 2);
        // 手指整体挪动时图片跟着走，再以中点为锚点缩放
        tx += mid.x - startMid.x;
        ty += mid.y - startMid.y;
        startMid = mid;
        zoomAt(mid.x, mid.y, startScale * (dist / startDist));
        e.preventDefault();
        return;
      }

      if (scale > MIN_SCALE + 0.001 && panStart) {
        const dx = e.clientX - panStart.x;
        const dy = e.clientY - panStart.y;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
        tx = panStart.tx + dx;
        ty = panStart.ty + dy;
        render();
        e.preventDefault();
      }
    });

    const endPointer = (e) => {
      pts.delete(e.pointerId);
      if (pts.size === 0) {
        panStart = null;
        startDist = 0;
        if (multiGesture) {
          multiGesture = false;
          moved = false;
          lastTap = 0;
          return;
        }
      }
      if (moved) {
        moved = false;
        return;
      }
      // 双击：放大 / 还原
      const now = Date.now();
      if (now - lastTap < 320) {
        lastTap = 0;
        if (scale > MIN_SCALE + 0.001) {
          reset();
        } else {
          const p = local(e.clientX, e.clientY);
          zoomAt(p.x, p.y, 2.4);
        }
      } else {
        lastTap = now;
      }
    };
    wrap.addEventListener('pointerup', endPointer);
    wrap.addEventListener('pointercancel', (e) => {
      pts.delete(e.pointerId);
      if (pts.size === 0) {
        panStart = null;
        startDist = 0;
      }
    });

    // 桌面端：Ctrl + 滚轮缩放，普通滚轮仍然滚页面
    wrap.addEventListener(
      'wheel',
      (e) => {
        if (!e.ctrlKey) return;
        e.preventDefault();
        const p = local(e.clientX, e.clientY);
        zoomAt(p.x, p.y, scale * (e.deltaY < 0 ? 1.12 : 1 / 1.12));
      },
      { passive: false },
    );

    wrap.addEventListener('contextmenu', (e) => e.preventDefault());
    img.addEventListener('load', render);
  }

  // ---------- 各种状态 ----------

  function show(src, fromCache) {
    stage.innerHTML = `
      <div class="cal-wrap" id="cal-wrap">
        <img id="cal-img" src="${escapeHtml(src)}" alt="教学日历" />
      </div>
      <div class="cal-hint">双指缩放 / 双击放大，放大后可拖动</div>
      ${
        fromCache
          ? `<div class="refresh-hint" style="padding-bottom:18px">当前为缓存图片，点右上角可刷新</div>`
          : ''
      }`;
    attachZoom();
  }

  function showLoading() {
    bar.hidden = true;
    stage.innerHTML = `<div class="skeleton" style="margin:14px">
      <div class="sk-line" style="width:40%"></div>
      <div class="sk-line" style="width:100%;height:180px"></div>
    </div>`;
  }

  function showError(message) {
    bar.hidden = true;
    stage.innerHTML = `<div class="state">
      <div class="emoji">🗓</div>
      <div class="title">校历加载失败</div>
      <div class="desc">${escapeHtml(message)}</div>
      <div class="actions"><button class="btn" id="retry">重试</button></div>
    </div>`;
    stage.querySelector('#retry')?.addEventListener('click', load);
  }

  bar.querySelector('#z-in').addEventListener('click', () => {
    const c = viewCenter();
    zoomAt(c.x, c.y, scale * 1.5);
  });
  bar.querySelector('#z-out').addEventListener('click', () => {
    const c = viewCenter();
    zoomAt(c.x, c.y, scale / 1.5);
  });
  bar.querySelector('#z-fit').addEventListener('click', reset);

  async function load(force = false) {
    if (!force) {
      const cached = localStorage.getItem(CACHE_KEY);
      if (cached) {

        return;
      }

      show(proxied, false);
      if (force) toast('已刷新');
    } catch (err) {
      showError(err.message || '未知错误');
    }
  }

  root.querySelector('#btn-refresh').addEventListener('click', () => load(true));
  load();
}

    const cells = monthGrid(y, m);

      .map((d) => {

        const inMonth = d.getMonth() === m;

          .filter(Boolean)

            ? Array.from({ length: dots }, () => '<i></i>').join('')
            : ''}</span>
        </button>`;
      })
      .join('');
  }

  function renderLegend() {
    if (!alive()) return;
    const y = view.getFullYear();
    const m = view.getMonth();
    let classes = 0;
    let days = 0;
    counts.forEach((n, key) => {
      const [ky, km] = key.split('-').map(Number);
      if (ky === y && km === m + 1 && n > 0) {
        classes += n;
        days++;
      }

  }

    const m = view.getMonth();

      onProgress: (d, t) => {
        done = d;

      },
      onDay: (key, data) => {
        counts.set(key, (data.courses || []).length);
      },
    });

    if (my !== token) return;
    loading = false;
    renderGrid();
    renderLegend();
  }

  function shift(n) {
    view = new Date(view.getFullYear(), view.getMonth() + n, 1);
    counts = new Map();
    renderGrid();
    renderLegend();
    load();
  }

  gridEl.addEventListener('click', (e) => {
    const cell = e.target.closest('.mon-cell');
    if (!cell) return;
    if (loading) toast('还在加载，稍等一下');
    location.hash = `#/calendar/${cell.dataset.key}`;
  });

  root.querySelector('#m-prev').addEventListener('click', () => shift(-1));
  root.querySelector('#m-next').addEventListener('click', () => shift(1));
  root.querySelector('#btn-today').addEventListener('click', () => {
    const t = new Date();
    if (view.getFullYear() === t.getFullYear() && view.getMonth() === t.getMonth()) {
      load();
      return;
    }
    view = new Date(t.getFullYear(), t.getMonth(), 1);
    counts = new Map();
    renderGrid();
    load();
  });

  load();
}

    paintMode();
    toast('已恢复默认作息');
    resync();

  document.addEventListener('visibilitychange', () => {
    if (!alive() || document.visibilityState !== 'visible') return;
    paintHero();
  });

  paintTables();

  ctx.param = routeParts()[1] || '';

  root.innerHTML = '';
  VIEWS[name].mount(root, ctx);
  window.scrollTo(0, 0);

  // 每次进页面都用缓存里的今日课程喂一次小组件，桌面数据不会掉队
  try {
    __mods["widgetdata"].push();
  } catch (e) {
    /* 网页版没有桥，忽略 */
  }
}

window.addEventListener('hashchange', render);
render();

// 本地开发不注册 SW，避免改代码后缓存不更新；线上才有离线能力
const isLocalhost = ['localhost', '127.0.0.1'].includes(location.hostname);
if ('serviceWorker' in navigator && !isLocalhost) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {
      /* 注册失败不影响使用 */
    });
  });
}

__mods["app"] = {  };
})();
})();
    </script>
  </body>
</html>
